name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit, visual and isolated installation tests
        shell: powershell
        run: .\test.ps1
      - name: Build installers and portable artifacts
        shell: powershell
        run: .\release.ps1
      - name: Installer and sandbox uninstall tests
        shell: powershell
        run: .\package-test.ps1
      - name: Privacy audit
        shell: powershell
        run: .\privacy-check.ps1
      - name: History audit
        shell: powershell
        run: .\audit-history.ps1
      - name: Portfolio integration assets
        shell: powershell
        run: .\integrations\piconera-tech\test.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QuotaDock-1.3.0-Windows-unsigned
          path: |
            dist/v1.3.0/QuotaDock-1.3.0-Setup.exe
            dist/v1.3.0/QuotaDock-1.3.0-Windows-Portable.zip
            dist/v1.3.0/QuotaDock.exe
            dist/v1.3.0/SHA256SUMS.txt
