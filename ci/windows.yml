name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (no credentials)
        shell: powershell
        run: .\test.ps1
      - name: Build installers and portable artifacts
        shell: powershell
        run: .\release.ps1
      - name: Privacy audit
        shell: powershell
        run: .\privacy-check.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaDock-1.0.0-Windows
          path: |
            dist/v1.0.0/QuotaDock-1.0.0-Setup.exe
            dist/v1.0.0/QuotaDock-1.0.0-Windows-Portable.zip
            dist/v1.0.0/QuotaDock.OpenAI.exe
            dist/v1.0.0/QuotaDock.Claude.exe
            dist/v1.0.0/SHA256SUMS.txt
