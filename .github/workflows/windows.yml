name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Audit submitted commits, not GitHub's synthetic PR merge identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Unit, visual and isolated installation tests
        shell: powershell
        run: .\test.ps1
      - name: Build installers and portable artifacts
        shell: powershell
        run: .\release.ps1
      - name: Installer and sandbox uninstall tests
        shell: powershell
        run: .\package-test.ps1
      - name: Privacy audit
        shell: powershell
        run: .\privacy-check.ps1
      - name: History audit
        shell: powershell
        run: .\audit-history.ps1
      - name: Portfolio integration assets
        shell: powershell
        run: .\integrations\piconera-tech\test.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QuotaDock-1.3.0-Windows-unsigned
          path: |
            dist/v1.3.0/QuotaDock-1.3.0-Setup.exe
            dist/v1.3.0/QuotaDock-1.3.0-Windows-Portable.zip
            dist/v1.3.0/QuotaDock.exe
            dist/v1.3.0/SHA256SUMS.txt
